name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Format check
        run: zig fmt --check src build.zig
      - name: Unit tests
        run: zig build test --summary all
      - name: End-to-end
        run: bash tests/e2e.sh
      - name: Metal backend type check (aarch64-macos, no Apple SDK needed)
        run: zig build metal-check
      - name: Compute backend selftest (CPU against the reference kernels)
        run: |
          zig build -Doptimize=ReleaseFast
          ./zig-out/bin/ditch selftest --device cpu
      - name: Cross-compile all release targets
        run: |
          for t in x86_64-linux-musl aarch64-linux-musl x86_64-linux-gnu.2.28 x86_64-macos aarch64-macos x86_64-windows-gnu; do
            zig build -Doptimize=ReleaseFast -Dtarget=$t --prefix "zig-out/$t"
          done

  # Apple silicon: the only place the Metal backend can actually be compiled
  # against Apple's SDK and run on a GPU. The job fails when a GPU kernel is
  # outside its tolerance, and says so loudly when the runner exposes no Metal
  # device at all (exit 78) instead of passing quietly.
  metal:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Metal backend, kernels and pipeline against the CPU reference
        run: |
          set -o pipefail
          status=0
          bash tests/metal_e2e.sh 2>&1 | tee metal.log || status=$?
          if [ "$status" = "78" ]; then
            echo "::warning title=Metal unverified::no usable Metal device on this runner; the GPU kernels were not executed"
            echo "### Metal: NOT VERIFIED (no usable Metal device on this runner)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$status" != "0" ]; then
            echo "### Metal: FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          echo "### Metal: verified against the CPU reference" >> "$GITHUB_STEP_SUMMARY"
          sed -n '/^Device: /,/kernels ran on the device/p' metal.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal-selftest-log
          path: metal.log

  # Vulkan on Mesa's lavapipe, a conformant software Vulkan driver: no GPU, so
  # this proves correctness (every kernel against the CPU reference, on both
  # memory paths, and whole abliterations compared with the CPU), not speed.
  # Here a missing device is a failure: the driver is installed by the job.
  vulkan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Vulkan loader, lavapipe and the shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-tools glslang-tools spirv-tools
          vulkaninfo --summary
      - name: Committed SPIR-V matches the GLSL sources
        run: bash tools/gen_spirv.sh --check
      - name: Unit tests against a live Vulkan device
        run: zig build test --summary all -Dtest-filter=Vulkan -Dtest-filter=resident -Dtest-filter="row reductions"
      - name: Vulkan backend, kernels and pipeline against the CPU reference
        run: |
          set -o pipefail
          status=0
          bash tests/vulkan_e2e.sh 2>&1 | tee vulkan.log || status=$?
          if [ "$status" != "0" ]; then
            echo "### Vulkan (lavapipe): FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          echo "### Vulkan (lavapipe): verified against the CPU reference" >> "$GITHUB_STEP_SUMMARY"
          sed -n '/^Device: /,/kernels ran on the device/p' vulkan.log >> "$GITHUB_STEP_SUMMARY"
      - name: The static release binary runs without Vulkan and says why
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=x86_64-linux-musl --prefix zig-out/musl
          ./zig-out/musl/bin/ditch selftest --device cpu > /dev/null
          status=0
          ./zig-out/musl/bin/ditch selftest --device vulkan 2> musl.err || status=$?
          cat musl.err
          [ "$status" = "2" ] && grep -q "statically linked" musl.err
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-selftest-log
          path: vulkan.log

  # Apple Silicon: the NEON kernel shape, the performance-core thread pool and
  # the Accelerate path only exist on this runner, so they are tested here.
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: CPU topology
        run: |
          sysctl -n machdep.cpu.brand_string
          echo "logical CPUs:       $(sysctl -n hw.logicalcpu)"
          echo "performance cores:  $(sysctl -n hw.perflevel0.logicalcpu)"
          echo "efficiency cores:   $(sysctl -n hw.perflevel1.logicalcpu || echo none)"
      - name: Format check
        run: zig fmt --check src build.zig
      - name: Unit tests, Accelerate built in
        run: zig build test --summary all -Daccelerate=true
      - name: Unit tests, Accelerate compiled out
        run: zig build test --summary all -Daccelerate=false
      - name: End-to-end
        run: bash tests/e2e.sh
      - name: Kernel throughput and the Accelerate A/B
        # Prints both tables and fails when Accelerate and the built-in kernel
        # disagree beyond the tolerance (bench.accelerate_tolerance).
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseFast -Daccelerate=true
          ./zig-out/bin/ditch --version
          ./zig-out/bin/ditch bench --kernels
          echo "--- built-in kernels only ---"
          ./zig-out/bin/ditch bench --kernels --no-accelerate
