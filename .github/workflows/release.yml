name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0 (the tag is created if missing)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Resolve version and create the tag when dispatched
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
            git config user.name "plyght"
            git config user.email "plyght@peril.lol"
            # A dispatched release always tags the commit it builds from.
            git tag -f -a "$version" -m "ditch $version"
            git push -f origin "refs/tags/$version"
          else
            version="${GITHUB_REF_NAME}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: zig build test --summary all
      - name: Build release binaries
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          for t in x86_64-linux-musl aarch64-linux-musl x86_64-macos aarch64-macos x86_64-windows-gnu; do
            zig build -Doptimize=ReleaseFast -Dtarget="$t" --prefix "zig-out/$t"
            name="ditch-${version}-${t}"
            staging="dist/$name"
            mkdir -p "$staging"
            cp README.md LICENSE config.default.lua "$staging/"
            case "$t" in
              *windows*)
                cp "zig-out/$t/bin/ditch.exe" "$staging/"
                (cd dist && zip -qr "$name.zip" "$name")
                ;;
              *)
                cp "zig-out/$t/bin/ditch" "$staging/"
                tar -C dist -czf "dist/$name.tar.gz" "$name"
                ;;
            esac
            rm -rf "$staging"
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          tag_name: ${{ steps.version.outputs.version }}
